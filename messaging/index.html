<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Relayless Messages</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{color-scheme:dark}body{background:#111017;background-image:linear-gradient(140deg,rgba(125,91,255,.12),transparent 40%),linear-gradient(320deg,rgba(105,215,208,.05),transparent 34%)}.chat-bg{background:#17141e;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:18px 18px}</style>
</head>
<body class="min-h-screen font-sans text-slate-200">
<div id="setup" class="mx-auto hidden min-h-screen max-w-xl px-5 py-12"><p class="text-xs uppercase tracking-[.2em] text-cyan-300">Relayless Messages</p><h1 class="mt-5 text-4xl font-semibold text-white">Set up your profile.</h1><p class="mt-4 text-sm leading-6 text-slate-400">Choose a unique username so other people can find you.</p><form id="profileForm" class="mt-8 rounded-xl border border-white/10 bg-[#181522] p-5"><label class="block text-xs text-slate-400">Display name<input id="profileName" required class="mt-2 w-full rounded-md bg-[#0d0c12] p-3 text-sm outline-none"></label><label class="mt-4 block text-xs text-slate-400">Username<input id="profileUsername" required pattern="[a-zA-Z0-9_]{3,20}" class="mt-2 w-full rounded-md bg-[#0d0c12] p-3 text-sm outline-none" placeholder="your_username"></label><label class="mt-4 block text-xs text-slate-400">Profile image (optional)<input id="profileImage" type="file" accept="image/*" class="mt-2 w-full text-xs"></label><button class="mt-5 w-full rounded-md bg-cyan-300 p-3 text-sm font-bold text-[#111017]">Complete profile</button></form></div>
<div id="auth" class="mx-auto hidden min-h-screen max-w-md px-5 py-20"><a href="../index.html" class="text-xs text-slate-500">&lt;- Relayless</a><p class="mt-12 text-xs uppercase tracking-[.2em] text-cyan-300">Private messaging</p><h1 id="authTitle" class="mt-4 text-4xl font-semibold text-white">Welcome back</h1><p class="mt-3 text-sm text-slate-400">Sign in to find people by username.</p><form id="authForm" class="mt-8"><input id="email" required type="email" class="mb-3 w-full rounded-md bg-[#181522] p-3 text-sm" placeholder="Email address"><input id="password" required type="password" minlength="6" class="w-full rounded-md bg-[#181522] p-3 text-sm" placeholder="Password"><button id="authButton" class="mt-4 w-full rounded-md bg-cyan-300 p-3 text-sm font-bold text-[#111017]">Sign in</button></form><button id="authSwitch" class="mt-5 text-xs text-slate-500">Create a new account</button></div>
<div id="app" class="hidden min-h-screen"><header class="border-b border-white/10 bg-[#15121d]/90"><div class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4"><div><strong id="meName" class="block text-sm text-white"></strong><small id="meUsername" class="text-xs text-slate-500"></small></div><div class="flex gap-4"><a href="../index.html" class="text-xs text-slate-500">Home</a><button id="logout" class="text-xs text-slate-500">Sign out</button></div></div></header><main class="mx-auto max-w-7xl px-5 py-6"><nav id="workspaceNav" class="mb-5 flex gap-2 rounded-xl border border-white/10 bg-[#181522]/80 p-2"><button data-view="chats" class="view-button rounded-lg bg-cyan-300 px-4 py-2 text-xs font-bold text-[#111017]">Chats</button><button data-view="search" class="view-button rounded-lg px-4 py-2 text-xs font-semibold text-slate-400 hover:bg-white/5 hover:text-white">Search people</button><button data-view="friends" class="view-button rounded-lg px-4 py-2 text-xs font-semibold text-slate-400 hover:bg-white/5 hover:text-white">Friends</button></nav><div id="workspace" class="grid gap-5 lg:grid-cols-[280px_1fr]"><aside class="space-y-5"><form id="searchForm" class="flex gap-2"><input id="search" required class="min-w-0 flex-1 rounded-lg bg-[#181522] p-3 text-sm outline-none" placeholder="Search username"><button type="submit" class="rounded-lg bg-cyan-300 px-4 text-xs font-bold text-[#111017]">Search</button></form><div id="results" class="space-y-2"></div><div id="requestPanel" class="rounded-xl bg-[#181522]/70 p-3"><p class="mb-3 text-[10px] uppercase tracking-[.18em] text-slate-500">Friend requests</p><div id="requests"></div></div><div id="friendsPanel" class="rounded-xl bg-[#181522]/70 p-3"><p class="mb-3 text-[10px] uppercase tracking-[.18em] text-slate-500">Conversations</p><div id="friends"></div></div></aside><section id="chatPanel" class="chat-bg flex min-h-[680px] flex-col rounded-xl border border-white/10"><div class="flex items-center justify-between border-b border-white/10 bg-[#191622]/90 p-5"><div><h2 id="chatTitle" class="text-sm font-semibold text-white">Select a conversation</h2><p id="chatStatus" class="text-xs text-emerald-400"></p></div><button id="call" class="hidden rounded-md border border-cyan-300/40 px-3 py-2 text-xs text-cyan-300">Video / voice call</button></div><div id="messages" class="flex-1 space-y-3 overflow-y-auto p-5"><p id="empty" class="py-24 text-center text-xs text-slate-600">Select a conversation to start chatting.</p></div><form id="composer" class="hidden flex gap-2 border-t border-white/10 p-3"><input id="attachment" type="file" accept="image/*,video/*,audio/*,.pdf,.txt,.doc,.docx" class="hidden"><button id="attach" type="button" class="h-10 w-10 rounded-full bg-violet-500 text-xl">+</button><input id="message" class="min-w-0 flex-1 rounded-full bg-white/5 px-4 text-sm outline-none" placeholder="Write a message..."><button class="h-10 w-10 rounded-full bg-cyan-300 font-bold text-[#111017]">&gt;</button></form></section></div></main></div><p id="toast" class="hidden"></p>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signInWithPopup,GoogleAuthProvider,FacebookAuthProvider,signOut}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
import{getFirestore,doc,getDoc,updateDoc,collection,query,where,orderBy,onSnapshot,addDoc,serverTimestamp,arrayUnion,arrayRemove,getDocs,runTransaction}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';
import{getStorage,ref,uploadBytes,getDownloadURL}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js';
const config={apiKey:'AIzaSyB7ssl6jTxKdy9XAtsAcrcvTU6eQjZzzQ8',authDomain:'relayless-messages.firebaseapp.com',projectId:'relayless-messages',storageBucket:'relayless-messages.firebasestorage.app',messagingSenderId:'157252473726',appId:'1:157252473726:web:7a2e2794c92dce7c49592f',measurementId:'G-6WZGL34YLC'};
const $=id=>document.getElementById(id);const configured=!Object.values(config).some(value=>value.includes('YOUR_')||value.includes('PASTE_'));const firebase= configured?initializeApp(config):null;const auth=firebase&&getAuth(firebase),db=firebase&&getFirestore(firebase),storage=firebase&&getStorage(firebase);const state={user:null,profile:null,friend:null,stop:null,profileStop:null,file:null};const e={setup:$('setup'),auth:$('auth'),app:$('app'),authForm:$('authForm'),authTitle:$('authTitle'),authButton:$('authButton'),authSwitch:$('authSwitch'),google:$('googleButton'),facebook:$('facebookButton'),email:$('email'),password:$('password'),profileForm:$('profileForm'),profileName:$('profileName'),profileUsername:$('profileUsername'),profileImage:$('profileImage'),meName:$('meName'),meUsername:$('meUsername'),nav:$('workspaceNav'),workspace:$('workspace'),searchPanel:$('searchForm').parentElement,results:$('results'),searchForm:$('searchForm'),search:$('search'),requestPanel:$('requestPanel'),requests:$('requests'),friendsPanel:$('friendsPanel'),friends:$('friends'),chatPanel:$('chatPanel'),title:$('chatTitle'),chatStatus:$('chatStatus'),messages:$('messages'),empty:$('empty'),composer:$('composer'),message:$('message'),attachment:$('attachment'),attach:$('attach'),call:$('call'),logout:$('logout'),toast:$('toast')};
const show=panel=>[e.setup,e.auth,e.app].forEach(item=>item.classList.toggle('hidden',item!==panel));const notify=(text,error=false)=>{e.toast.textContent=text;e.toast.className=`fixed bottom-5 left-1/2 z-30 -translate-x-1/2 rounded-full border px-4 py-2 text-xs ${error?'border-rose-400/40 text-rose-300':'border-cyan-300/40 text-cyan-300'}`;setTimeout(()=>e.toast.classList.add('hidden'),3000)};const chatId=(a,b)=>[a,b].sort().join('_');
function mode(login){e.authTitle.textContent=login?'Welcome back':'Create your account';e.authButton.textContent=login?'Sign in':'Create account';e.authSwitch.textContent=login?'Create a new account':'I already have an account';e.auth.dataset.login=login}
function row(user,request=false){const item=document.createElement('div');item.className='flex items-center gap-2 rounded-lg bg-white/5 p-3';item.innerHTML=`<span class="grid h-9 w-9 place-items-center rounded-full bg-violet-500 text-sm">${(user.displayName||'?')[0]}</span><span class="min-w-0 flex-1 truncate text-xs">${user.displayName}</span><button class="rounded bg-cyan-300 px-2 py-1 text-[10px] font-bold text-[#111017]">${request?'Accept':'Connect'}</button>`;item.querySelector('button').onclick=()=>request?accept(user):sendRequest(user);return item}
function switchView(view){const search=view==='search',friends=view==='friends';e.searchPanel.classList.toggle('hidden',!search);e.results.classList.toggle('hidden',!search);e.requestPanel.classList.toggle('hidden',view!=='requests');e.friendsPanel.classList.toggle('hidden',view!=='friends'&&!(!search&&view==='chats'));e.chatPanel.classList.toggle('hidden',!(!search&&!friends&&!((view==='requests'))));e.nav.querySelectorAll('[data-view]').forEach(button=>{const active=button.dataset.view===view;button.className=`view-button rounded-lg px-4 py-2 text-xs font-semibold ${active?'bg-cyan-300 text-[#111017]':'text-slate-400 hover:bg-white/5 hover:text-white'}`})}
function loadProfile(user){if(state.profileStop)state.profileStop();state.profileStop=onSnapshot(doc(db,'users',user.uid),snap=>{if(!snap.exists()){const social=user.providerData.some(item=>item.providerId==='google.com'||item.providerId==='facebook.com');e.profileName.value=user.displayName||user.email?.split('@')[0]||'';e.profileName.parentElement.classList.toggle('hidden',social);return show(e.setup)}const previous=state.profile?.friendRequests?.length||0;const firstLoad=!state.profile;state.profile={uid:user.uid,...snap.data()};state.profile.friendRequests=state.profile.friendRequests||[];state.profile.friends=state.profile.friends||[];e.meName.textContent=state.profile.displayName;e.meUsername.textContent=`@${state.profile.username}`;show(e.app);loadSocial();if(state.profile.friendRequests.length>previous&&!firstLoad)notify('New friend request received.');if(firstLoad)switchView('chats')},error=>notify(`Profile refresh failed: ${error.message}`,true))}
async function loadSocial(){e.friends.replaceChildren();e.requests.replaceChildren();const friends=state.profile.friends||[],requests=state.profile.friendRequests||[];if(friends.length){const result=await getDocs(query(collection(db,'users'),where('__name__','in',friends.slice(0,10))));result.docs.forEach(item=>e.friends.append(row({uid:item.id,...item.data()})))}if(requests.length){const result=await getDocs(query(collection(db,'users'),where('__name__','in',requests.slice(0,10))));result.docs.forEach(item=>e.requests.append(row({uid:item.id,...item.data()},true)))}}
async function searchUsers(){const term=e.search.value.trim().toLowerCase();e.results.replaceChildren();if(term.length<2)return;const result=await getDocs(query(collection(db,'users'),where('username','>=',term),where('username','<=',`${term}\uf8ff`)));result.docs.filter(item=>item.id!==state.user.uid).forEach(item=>e.results.append(row({uid:item.id,...item.data()})))}async function sendRequest(user){await updateDoc(doc(db,'users',user.uid),{friendRequests:arrayUnion(state.user.uid)});notify('Request sent.')}async function accept(user){await updateDoc(doc(db,'users',state.user.uid),{friendRequests:arrayRemove(user.uid),friends:arrayUnion(user.uid)});await updateDoc(doc(db,'users',user.uid),{friends:arrayUnion(state.user.uid)});state.profile.friends=[...(state.profile.friends||[]),user.uid];loadSocial();notify('Connected.')}
function openChat(friend){state.friend=friend;e.title.textContent=friend.displayName;e.chatStatus.textContent=`@${friend.username} · connected`;e.composer.classList.remove('hidden');e.call.classList.remove('hidden');if(state.stop)state.stop();const messages=query(collection(db,'chats',chatId(state.user.uid,friend.uid),'messages'),orderBy('createdAt','asc'));state.stop=onSnapshot(messages,snap=>{e.messages.replaceChildren();if(snap.empty)e.messages.append(e.empty);snap.forEach(item=>{const message=item.data(),own=message.senderId===state.user.uid,row=document.createElement('div');row.className=`flex ${own?'justify-end':'justify-start'}`;row.innerHTML=`<div class="max-w-[80%] rounded-2xl ${own?'bg-violet-500':'bg-white/10'} px-4 py-2.5 text-sm">${message.text||''}${message.fileURL?`<a class="block text-cyan-300" href="${message.fileURL}" target="_blank">Open ${message.fileName}</a>`:''}</div>`;e.messages.append(row)});e.messages.scrollTop=e.messages.scrollHeight})}
async function sendMessage(event){event.preventDefault();if(!state.friend||(!e.message.value.trim()&&!state.file))return;const chat=chatId(state.user.uid,state.friend.uid);let fileURL='',fileName='';if(state.file){const location=ref(storage,`chat-files/${chat}/${crypto.randomUUID()}-${state.file.name}`);await uploadBytes(location,state.file);fileURL=await getDownloadURL(location);fileName=state.file.name}await addDoc(collection(db,'chats',chat,'messages'),{senderId:state.user.uid,text:e.message.value.trim(),fileURL,fileName,createdAt:serverTimestamp()});e.message.value='';state.file=null;e.attachment.value=''}
async function setupProfile(event){event.preventDefault();const username=e.profileUsername.value.trim().toLowerCase();try{await runTransaction(db,async transaction=>{const usernameRef=doc(db,'usernames',username);if((await transaction.get(usernameRef)).exists())throw Error('Username is taken.');transaction.set(usernameRef,{uid:state.user.uid});transaction.set(doc(db,'users',state.user.uid),{uid:state.user.uid,displayName:e.profileName.value.trim()||state.user.displayName||state.user.email?.split('@')[0]||'User',username,photoURL:state.user.photoURL||'',friends:[],friendRequests:[],createdAt:serverTimestamp()})});if(e.profileImage.files[0]){const location=ref(storage,`avatars/${state.user.uid}`);await uploadBytes(location,e.profileImage.files[0]);await updateDoc(doc(db,'users',state.user.uid),{photoURL:await getDownloadURL(location)})}loadProfile(state.user)}catch(error){notify(error.message,true)}}
async function authenticate(event){event.preventDefault();try{const result=e.auth.dataset.login==='true'?await signInWithEmailAndPassword(auth,e.email.value,e.password.value):await createUserWithEmailAndPassword(auth,e.email.value,e.password.value);state.user=result.user;if(e.auth.dataset.login!=='true')show(e.setup)}catch(error){notify(error.message.replace('Firebase: ',''),true)}}
async function googleSignIn(){try{const result=await signInWithPopup(auth,new GoogleAuthProvider());state.user=result.user;await loadProfile(result.user)}catch(error){notify(error.message.replace('Firebase: ',''),true)}}
async function facebookSignIn(){try{const result=await signInWithPopup(auth,new FacebookAuthProvider());state.user=result.user;await loadProfile(result.user)}catch(error){notify(error.message.replace('Firebase: ',''),true)}}
document.getElementById('facebookButton').onclick=facebookSignIn;
e.authForm.onsubmit=authenticate;e.google.onclick=googleSignIn;e.profileForm.onsubmit=setupProfile;e.authSwitch.onclick=()=>mode(e.auth.dataset.login!=='true');e.nav.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>switchView(button.dataset.view));e.searchForm.onsubmit=event=>{event.preventDefault();searchUsers()};e.logout.onclick=()=>signOut(auth);e.composer.onsubmit=sendMessage;e.attach.onclick=()=>e.attachment.click();e.attachment.onchange=event=>{state.file=event.target.files[0];if(state.file)notify(`${state.file.name} attached.`)};e.call.onclick=()=>{if(state.friend)location.href=`../call/index.html?user=${encodeURIComponent(state.friend.username)}`};if(!configured)show(e.setup);else{mode(true);onAuthStateChanged(auth,user=>{state.user=user;if(user)loadProfile(user);else{if(state.profileStop)state.profileStop();state.profile=null;show(e.auth)}})}
</script>
<button id="googleButton" type="button" class="mt-8 w-full rounded-md border border-cyan-300/40 bg-[#181522] p-3 text-sm font-semibold text-white hover:border-cyan-300 hover:bg-cyan-300/10">Continue with Google</button>
<button id="facebookButton" type="button" class="mt-3 w-full rounded-md border border-blue-400/40 bg-[#181522] p-3 text-sm font-semibold text-white hover:border-blue-300 hover:bg-blue-400/10">Continue with Facebook</button>
<script>document.getElementById('authForm').before(document.getElementById('googleButton'));</script>
<script>document.getElementById('authForm').before(document.getElementById('facebookButton'));</script>
<script>
	const requestTab = document.createElement('button');
	requestTab.type = 'button'; requestTab.dataset.view = 'requests'; requestTab.textContent = 'Friend requests';
	requestTab.className = 'view-button rounded-lg px-4 py-2 text-xs font-semibold text-slate-400 hover:bg-white/5 hover:text-white';
	document.getElementById('workspaceNav').append(requestTab);
	requestTab.addEventListener('click', () => {
		const search = document.getElementById('searchForm').parentElement;
		const results = document.getElementById('results'); const requests = document.getElementById('requestPanel');
		const friends = document.getElementById('friendsPanel'); const chat = document.getElementById('chatPanel');
		search.classList.add('hidden'); results.classList.add('hidden'); friends.classList.add('hidden'); chat.classList.add('hidden'); requests.classList.remove('hidden');
		document.querySelectorAll('#workspaceNav [data-view]').forEach(button => button.className = button === requestTab ? 'view-button rounded-lg bg-cyan-300 px-4 py-2 text-xs font-bold text-[#111017]' : 'view-button rounded-lg px-4 py-2 text-xs font-semibold text-slate-400 hover:bg-white/5 hover:text-white');
	});
</script>
</body>
</html>
