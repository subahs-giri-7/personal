<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relayless | Settings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="site-menu.css">
  <style>
    .settings-page{min-height:100vh;background:#e7ebef}.settings-shell{width:min(calc(100% - 32px),820px);margin:0 auto}.settings-card{border:1px solid #cfd6de;border-radius:18px;background:#f5f7f9;box-shadow:0 18px 55px rgba(20,42,86,.1)}.settings-page input,.settings-page select{border:1px solid #cbd4de;background:#e8edf1;color:#18212b;outline:none}.settings-page input:focus,.settings-page select:focus{border-color:#607b98;box-shadow:0 0 0 4px rgba(69,101,132,.12)}.settings-page input[type=checkbox]{accent-color:#405f7d}.settings-status{min-height:20px;color:#667482;font-size:12px}.settings-status.success{color:#187653}.settings-status.error{color:#b3483d}.settings-page .hidden{display:none}
  </style>
</head>
<body class="settings-page">
  <header class="border-b border-line"><div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-4"><a href="index.html" class="site-brand"><img src="logo.png" alt="Relayless Messenger logo"><span><strong class="block text-sm">Relayless Messenger</strong><small>Account settings</small></span></a></div></header>
  <main class="settings-shell py-10">
    <section class="settings-card p-6 sm:p-9">
      <a id="backLink" class="text-xs font-semibold text-blue-700" href="profile.html">&lt;- Back to profile</a>
      <div class="mt-6"><p class="text-xs font-bold uppercase tracking-[.2em] text-blue-700">Preferences</p><h1 class="mt-2 text-3xl font-extrabold text-slate-900">Account settings</h1><p class="mt-2 text-sm text-slate-600">Keep your account details and contact preferences up to date.</p></div>
      <form id="settingsForm" class="mt-8 space-y-6">
        <div class="border-b border-slate-200 pb-6"><h2 class="text-base font-bold text-slate-900">Account details</h2><div class="mt-4 grid gap-4 sm:grid-cols-2"><label class="text-xs font-semibold text-slate-600">Nickname<input id="nickname" maxlength="40" class="mt-2 w-full rounded-xl px-3 py-3 text-sm" placeholder="How friends can address you"></label><label class="text-xs font-semibold text-slate-600">Birthday<input id="birthday" type="date" class="mt-2 w-full rounded-xl px-3 py-3 text-sm"></label><label class="text-xs font-semibold text-slate-600 sm:col-span-2">Recovery contact<input id="recoveryContact" type="email" maxlength="160" class="mt-2 w-full rounded-xl px-3 py-3 text-sm" placeholder="trusted-contact@example.com"><span class="mt-1 block text-[11px] font-normal text-slate-500">Stored as an account contact reference. It does not change your sign-in email.</span></label></div></div>
        <div class="border-b border-slate-200 pb-6"><h2 class="text-base font-bold text-slate-900">Privacy and notifications</h2><div class="mt-4 space-y-3"><label class="flex items-center gap-3 text-sm text-slate-700"><input id="showBirthday" type="checkbox" class="h-4 w-4"> Show my birthday on my profile</label><label class="flex items-center gap-3 text-sm text-slate-700"><input id="allowMessages" type="checkbox" class="h-4 w-4"> Allow new message requests</label><label class="flex items-center gap-3 text-sm text-slate-700"><input id="emailUpdates" type="checkbox" class="h-4 w-4"> Receive account updates by email</label></div></div>
        <p id="settingsStatus" class="settings-status" role="status"></p>
        <div class="flex flex-wrap gap-2"><button id="saveSettings" type="submit" class="rounded-full bg-slate-700 px-5 py-2.5 text-xs font-bold text-white">Save settings</button><a id="cancelSettings" class="rounded-full border border-slate-300 px-5 py-2.5 text-xs font-bold text-slate-700" href="profile.html">Cancel</a></div>
      </form>
    </section>
  </main>
  <script type="module">
    import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
    import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
    import{getFirestore,doc,getDoc,updateDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';
    const config={apiKey:'AIzaSyB7ssl6jTxKdy9XAtsAcrcvTU6eQjZzzQ8',authDomain:'relayless-messages.firebaseapp.com',projectId:'relayless-messages',storageBucket:'relayless-messages.firebasestorage.app',messagingSenderId:'157252473726',appId:'1:157252473726:web:7a2e2794c92dce7c49592f',measurementId:'G-6WZGL34YLC'};
    const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let viewer=null;
    const status=(text,type='normal')=>{$('settingsStatus').className=`settings-status ${type==='error'?'error':type==='success'?'success':''}`;$('settingsStatus').textContent=text};
    const wait=promise=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error('Settings update timed out. Check your connection and try again.')),12000))]);
    function fill(data){$('nickname').value=data.nickname||'';$('birthday').value=data.birthday||'';$('recoveryContact').value=data.recoveryContact||'';$('showBirthday').checked=data.showBirthday===true;$('allowMessages').checked=data.allowMessages!==false;$('emailUpdates').checked=data.emailUpdates===true;$('backLink').href=`profile.html?uid=${encodeURIComponent(viewer.uid)}`;$('cancelSettings').href=$('backLink').href}
    async function save(event){event.preventDefault();const button=$('saveSettings');button.disabled=true;button.textContent='Saving...';status('Saving settings...');const recovery=$('recoveryContact').value.trim();if(recovery&&!/^\S+@\S+\.\S+$/.test(recovery)){status('Enter a valid recovery email address.','error');button.disabled=false;button.textContent='Save settings';return}try{await wait(updateDoc(doc(db,'users',viewer.uid),{nickname:$('nickname').value.trim(),birthday:$('birthday').value, recoveryContact:recovery,showBirthday:$('showBirthday').checked,allowMessages:$('allowMessages').checked,emailUpdates:$('emailUpdates').checked,updatedAt:serverTimestamp()}));status('Settings saved.','success');setTimeout(()=>location.href=$('backLink').href,700)}catch(error){status(error.message||'Could not save settings.','error')}finally{button.disabled=false;button.textContent='Save settings'}}
    onAuthStateChanged(auth,async user=>{viewer=user;if(!user){location.href='messaging/index.html';return}try{const snapshot=await getDoc(doc(db,'users',user.uid));if(!snapshot.exists()){status('Your profile could not be found.','error');return}fill(snapshot.data())}catch(error){status(error.message||'Could not load settings.','error')}});$('settingsForm').onsubmit=save;
  </script>
  <script src="site-menu.js"></script>
</body>
</html>
