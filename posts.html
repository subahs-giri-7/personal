<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Relayless | Posts</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css">
<style>
.posts-page{min-height:100vh}.posts-shell{width:min(100% - 32px,1180px);margin:auto}.posts-layout{display:grid;grid-template-columns:minmax(0,680px) 300px;gap:28px;align-items:start}.posts-feed{min-width:0}.post-composer,.post-card{border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.9);box-shadow:0 18px 45px rgba(20,42,86,.08)}.post-composer{position:sticky;top:24px}.post-composer form{display:none}.post-composer.is-open form{display:block}.post-composer textarea{min-height:110px;resize:vertical}.posts-page input,.posts-page textarea{border:1px solid var(--line);background:#f7f9fc;color:var(--ink);outline:none}.posts-page input:focus,.posts-page textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(23,105,255,.1)}.post-media{display:block;width:100%;max-height:560px;object-fit:cover;background:#f1f5fb}.post-avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#e8efff}.post-avatar-fallback{display:grid;place-items:center;color:var(--blue);font-weight:800}.post-action{color:#5d6470}.post-action:hover{color:var(--blue)}.post-action.active{color:#1769ff;font-weight:700}.comment-list{border-top:1px solid #edf0f4}.comment-row{border-bottom:1px solid #edf0f4}.posts-page .hidden{display:none}.upload-label{display:inline-flex;cursor:pointer;align-items:center;gap:8px;border:1px dashed #b9c9e8;border-radius:12px;padding:10px 14px;color:var(--blue);font-size:12px;font-weight:700;background:#f4f7ff}.post-status{min-height:18px;font-size:12px;color:#5d6470}.post-status.error{color:#c94c3c}.post-status.success{color:#16845b}.create-badge{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:#f0f6ff;color:var(--blue);font-size:24px}.create-trigger{display:flex;width:100%;align-items:center;gap:12px;text-align:left}.create-trigger strong{font-size:13px;color:#10131b}.create-trigger span{display:block;margin-top:3px;color:#8a909b;font-size:11px}@media(max-width:820px){.posts-layout{grid-template-columns:1fr}.post-composer{position:static;grid-row:1}.posts-feed{grid-row:2}}@media(max-width:640px){.posts-shell{width:min(100% - 20px,920px)}.post-composer,.post-card{border-radius:16px}.posts-page header nav a:not(:last-child){display:none}}
</style>
</head>
<body class="posts-page">
<header class="border-b border-line"><div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-4"><a href="index.html" class="site-brand"><img src="logo.png" alt="Relayless logo"><span><strong class="block text-sm">Relayless</strong><small>Posts and conversations</small></span></a><nav class="flex items-center gap-5 text-xs font-semibold text-slate-500"><a href="messaging/index.html">Messages</a><a href="posts.html">Posts</a><a href="share.html">Share</a><a href="call/index.html">Calls</a></nav></div></header>
<main class="posts-shell py-10"><div class="mb-8"><p class="text-xs font-bold uppercase tracking-[.2em] text-blue-600">Community</p><h1 class="mt-3 text-4xl font-extrabold tracking-tight text-slate-900">A place for the moments worth sharing.</h1><p class="mt-3 max-w-2xl text-sm leading-6 text-slate-500">Publish a thought, photo, or video. React and comment with the people you follow.</p></div>
<div class="posts-layout"><section id="feed" class="posts-feed space-y-5"><p id="feedLoading" class="py-12 text-center text-sm text-slate-500">Loading posts...</p></section><section id="composer" class="post-composer p-5 sm:p-6"><button id="createTrigger" type="button" class="create-trigger"><div class="create-badge">+</div><span><strong>Create a post</strong><span>Share a thought, photo, or video</span></span></button><form id="postForm" class="mt-5"><textarea id="postText" maxlength="2000" class="w-full rounded-2xl px-4 py-3 text-sm" placeholder="Share something meaningful..."></textarea><div class="mt-4 space-y-2"><label class="upload-label w-full"><input id="mediaInput" type="file" accept="image/*,video/*" class="hidden">Add photo or video</label><button id="publishButton" class="w-full rounded-full bg-blue-600 px-5 py-2.5 text-xs font-bold text-white">Publish post</button></div><p id="postStatus" class="post-status mt-3" role="status"></p></form></section></div></main>
<span id="composerName" class="hidden">Sign in to post</span><span id="composerHint" class="hidden">Your post will appear in the community feed.</span><p id="toast" class="fixed bottom-5 left-1/2 hidden -translate-x-1/2 rounded-full bg-slate-900 px-5 py-3 text-xs text-white"></p>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import{getFirestore,collection,query,orderBy,onSnapshot,doc,getDoc,getDocs,addDoc,updateDoc,serverTimestamp,increment}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';
const config={apiKey:'AIzaSyB7ssl6jTxKdy9XAtsAcrcvTU6eQjZzzQ8',authDomain:'relayless-messages.firebaseapp.com',projectId:'relayless-messages',storageBucket:'relayless-messages.firebasestorage.app',messagingSenderId:'157252473726',appId:'1:157252473726:web:7a2e2794c92dce7c49592f',measurementId:'G-6WZGL34YLC'},app=initializeApp(config),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id),CLOUD_NAME='mrq0ieyl',UPLOAD_PRESET='ml_default';let viewer=null,viewerProfile=null;
const toast=text=>{const item=$('toast');item.textContent=text;item.classList.remove('hidden');setTimeout(()=>item.classList.add('hidden'),2800)};const escape=value=>String(value||'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));const postTime=value=>{const date=value?.toDate?value.toDate():value?new Date(value):null;if(!date)return'Just now';const minutes=Math.floor((Date.now()-date.getTime())/60000),hours=Math.floor(minutes/60);if(minutes<1)return'Just now';if(minutes<60)return`${minutes} minute${minutes===1?'':'s'} ago`;if(hours<24)return`${hours} hour${hours===1?'':'s'} ago`;return date.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})};
async function uploadMedia(file){const body=new FormData();body.append('file',file);body.append('upload_preset',UPLOAD_PRESET);const response=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`,{method:'POST',body});const data=await response.json();if(!response.ok)throw Error(data.error?.message||'Cloudinary upload failed. Confirm the ml_default preset is set to Unsigned.');return data.secure_url}
function avatar(profile){return profile?.photoURL?`<img class="post-avatar" src="${escape(profile.photoURL)}" alt="">`:`<span class="post-avatar post-avatar-fallback">${escape((profile?.displayName||'R')[0].toUpperCase())}</span>`}
async function profile(uid){const snap=await getDoc(doc(db,'users',uid));return snap.exists()?{uid:snap.id,...snap.data()}:{uid,displayName:'Relayless user'}}
async function publish(event){event.preventDefault();if(!viewer){$('postStatus').className='post-status error mt-3';$('postStatus').textContent='Sign in through Messages before publishing.';return}const text=$('postText').value.trim(),file=$('mediaInput').files[0];if(!text&&!file){$('postStatus').className='post-status error mt-3';$('postStatus').textContent='Write something or choose media first.';return}const button=$('publishButton');button.disabled=true;button.textContent='Publishing...';$('postStatus').className='post-status mt-3';$('postStatus').textContent=file?'Uploading media to Cloudinary...':'Saving post...';try{let mediaUrl='',mediaType='';if(file){mediaUrl=await uploadMedia(file);mediaType=file.type.startsWith('video/')?'video':'image'}await addDoc(collection(db,'posts'),{authorId:viewer.uid,authorName:viewerProfile.displayName||viewer.displayName||'Relayless user',authorUsername:viewerProfile.username||'',authorPhotoURL:viewerProfile.photoURL||'',text,mediaUrl,mediaType,createdAt:serverTimestamp(),reactionCount:0,commentCount:0,reactions:{}});$('postText').value='';$('mediaInput').value='';$('postStatus').className='post-status success mt-3';$('postStatus').textContent='Post published successfully.'}catch(error){$('postStatus').className='post-status error mt-3';$('postStatus').textContent=error.message;toast(error.message)}finally{button.disabled=false;button.textContent='Publish post'}}
function renderPost(post){const data=post.data,card=document.createElement('article');card.className='post-card overflow-hidden';card.dataset.id=post.id;const date=data.createdAt?.toDate?data.createdAt.toDate().toLocaleString(): 'Just now';const media=data.mediaUrl?(data.mediaType==='video'?`<video class="post-media" controls src="${escape(data.mediaUrl)}"></video>`:`<img class="post-media" src="${escape(data.mediaUrl)}" alt="Post media" loading="lazy">`):'';card.innerHTML=`<div class="flex items-center gap-3 p-5"><a href="profile.html?uid=${encodeURIComponent(data.authorId)}">${avatar(data)}</a><div class="min-w-0 flex-1"><a class="block truncate text-sm font-bold text-slate-900" href="profile.html?uid=${encodeURIComponent(data.authorId)}">${escape(data.authorName||'Relayless user')}</a><a class="block truncate text-xs text-blue-600" href="profile.html?uid=${encodeURIComponent(data.authorId)}">@${escape(data.authorUsername||'user')} · ${date}</a></div></div>${data.text?`<p class="whitespace-pre-wrap px-5 pb-5 text-sm leading-6 text-slate-700">${escape(data.text)}</p>`:''}${media}<div class="flex items-center gap-5 px-5 py-4 text-xs"><button class="post-action" data-action="react">Like <span>${data.reactionCount||0}</span></button><button class="post-action" data-action="comments">Comment <span>${data.commentCount||0}</span></button></div><div class="comment-list hidden px-5 pb-4"><div class="comments space-y-2"></div><form class="comment-form mt-3 flex gap-2"><input class="comment-input min-w-0 flex-1 rounded-full px-4 py-2 text-xs" maxlength="500" placeholder="Write a comment..."><button class="rounded-full bg-blue-600 px-4 py-2 text-xs font-bold text-white">Send</button></form></div>`;card.querySelector('[data-action="react"]').onclick=async()=>{if(!viewer){toast('Sign in to react.');return}const liked=data.reactions?.[viewer.uid];await updateDoc(doc(db,'posts',post.id),{[`reactions.${viewer.uid}`]:liked?null:'like',reactionCount:increment(liked?-1:1)});data.reactions=data.reactions||{};if(liked)delete data.reactions[viewer.uid];else data.reactions[viewer.uid]='like';data.reactionCount=(data.reactionCount||0)+(liked?-1:1);card.querySelector('[data-action="react"]').classList.toggle('active',!liked);card.querySelector('[data-action="react"] span').textContent=data.reactionCount};card.querySelector('[data-action="comments"]').onclick=()=>{const area=card.querySelector('.comment-list');area.classList.toggle('hidden');if(!area.classList.contains('hidden'))loadComments(post.id,card)};card.querySelector('.comment-form').onsubmit=event=>addComment(event,post.id,card);return card}
async function loadComments(postId,card){const list=card.querySelector('.comments');list.replaceChildren();const snap=await getDocs(query(collection(db,'posts',postId,'comments'),orderBy('createdAt','asc'))).catch(()=>null);if(!snap||snap.empty){list.innerHTML='<p class="text-xs text-slate-500">No comments yet.</p>';return}snap.forEach(item=>{const data=item.data(),row=document.createElement('div');row.className='comment-row py-2 text-xs';row.innerHTML=`<a class="font-bold text-blue-600" href="profile.html?uid=${encodeURIComponent(data.authorId)}">${escape(data.authorName)}</a><span class="ml-2 text-slate-600">${escape(data.text)}</span>`;list.append(row)})}
async function addComment(event,postId,card){event.preventDefault();if(!viewer){toast('Sign in to comment.');return}const input=card.querySelector('.comment-input'),text=input.value.trim();if(!text)return;const button=event.submitter;button.disabled=true;try{await addDoc(collection(db,'posts',postId,'comments'),{authorId:viewer.uid,authorName:viewerProfile.displayName||'Relayless user',text,createdAt:serverTimestamp()});await updateDoc(doc(db,'posts',postId),{commentCount:increment(1)});input.value='';loadComments(postId,card)}catch(error){toast(error.message)}finally{button.disabled=false}}
onAuthStateChanged(auth,async user=>{viewer=user;if(user){viewerProfile=await profile(user.uid);$('composerName').textContent=viewerProfile.displayName||'Relayless user';$('composerHint').textContent='Post as @'+(viewerProfile.username||'user')}else{$('composerName').textContent='Sign in to post'}});$('postForm').onsubmit=publish;onSnapshot(query(collection(db,'posts'),orderBy('createdAt','desc')),snap=>{$('feed').replaceChildren();if(snap.empty){$('feed').innerHTML='<p class="post-card p-10 text-center text-sm text-slate-500">No posts yet. Be the first to share something.</p>';return}snap.forEach(item=>$('feed').append(renderPost({id:item.id,data:item.data()})))},error=>{$('feed').innerHTML=`<p class="post-card p-10 text-center text-sm text-rose-500">Could not load posts: ${escape(error.message)}</p>`});
</script><script>document.getElementById('createTrigger').onclick=()=>{const composer=document.getElementById('composer');composer.classList.toggle('is-open');if(composer.classList.contains('is-open'))document.getElementById('postText').focus()};const refreshPostTimes=()=>document.querySelectorAll('#feed article a.text-blue-600:not([data-time-ready])').forEach(link=>{const parts=link.textContent.split(' · '),date=parts.pop();if(date&&date!=='Just now'){const parsed=new Date(date);if(!Number.isNaN(parsed.getTime())){link.textContent=`${parts.join(' · ')} · ${(()=>{const minutes=Math.floor((Date.now()-parsed.getTime())/60000),hours=Math.floor(minutes/60);return minutes<1?'Just now':minutes<60?`${minutes} minute${minutes===1?'':'s'} ago`:hours<24?`${hours} hour${hours===1?'':'s'} ago`:parsed.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})})()}`;link.dataset.timeReady='true'}}});new MutationObserver(refreshPostTimes).observe(document.getElementById('feed'),{childList:true,subtree:true});</script></body></html>
