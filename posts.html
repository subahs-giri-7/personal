<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Relayless | Posts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="site-menu.css" />
    <style>
      .posts-page {
        min-height: 100vh;
        background: #edf1f5;
      }
      .posts-shell {
        width: min(100% - 32px, 1180px);
        margin: auto;
      }
      .posts-layout {
        display: grid;
        grid-template-columns: minmax(0, 680px) 300px;
        gap: 28px;
        align-items: start;
      }
      .posts-feed {
        min-width: 0;
      }
      .post-composer,
      .post-card {
        border: 1px solid var(--line);
        border-radius: 20px;
        background: #f7f8fa;
        box-shadow: 0 18px 45px rgba(20, 42, 86, 0.12);
      }
      .post-composer {
        position: sticky;
        top: 24px;
      }
      .post-composer form {
        display: none;
      }
      .post-composer.is-open form {
        display: block;
      }
      .post-composer textarea {
        min-height: 110px;
        resize: vertical;
      }
      .posts-page input,
      .posts-page textarea {
        border: 1px solid var(--line);
        background: #e9edf2;
        color: var(--ink);
        outline: none;
      }
      .posts-page input:focus,
      .posts-page textarea:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 4px rgba(23, 105, 255, 0.1);
      }
      .post-media {
        display: block;
        width: 100%;
        max-height: 340px;
        object-fit: cover;
        background: #dce2e9;
        cursor: zoom-in;
      }
      .post-viewer,
      .share-panel {
        position: fixed;
        inset: 0;
        z-index: 2100;
        display: grid;
        place-items: center;
        padding: 20px;
        background: rgba(16, 19, 27, 0.76);
      }
      .post-viewer-card,
      .share-panel-card {
        width: min(100%, 720px);
        max-height: calc(100vh - 40px);
        overflow: auto;
        border: 1px solid #cbd3dc;
        border-radius: 16px;
        background: #f7f8fa;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.3);
      }
      .post-viewer-media {
        display: block;
        width: 100%;
        max-height: 70vh;
        object-fit: contain;
        background: #dce2e9;
      }
      .share-friend {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 10px;
        padding: 10px;
        border-radius: 10px;
        text-align: left;
      }
      .share-friend:hover { background: #e4eaf0; }
      .share-friend-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: #dbe2eb; }
      .share-friend-avatar-fallback { display: grid; place-items: center; color: #385879; font-weight: 800; }
      .post-text-preview { cursor: zoom-in; }
      .post-text-preview:hover { color: #315d8a; }
      .post-viewer[hidden],
      .share-panel[hidden] { display: none; }
      }
      .post-avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        object-fit: cover;
        background: #dbe2eb;
      }
      .post-avatar-fallback {
        display: grid;
        place-items: center;
        color: #385879;
        font-weight: 800;
      }
      .post-action {
        color: #596573;
      }
      .post-action:hover {
        color: var(--blue);
      }
      .post-action.active {
        color: #315d8a;
        font-weight: 700;
      }
      .comment-list {
        border-top: 1px solid #edf0f4;
      }
      .comment-row {
        border-bottom: 1px solid #edf0f4;
      }
      .posts-page .hidden {
        display: none;
      }
      .upload-label {
        display: inline-flex;
        cursor: pointer;
        align-items: center;
        gap: 8px;
        border: 1px dashed #b9c9e8;
        border-radius: 12px;
        padding: 10px 14px;
        color: #315d8a;
        font-size: 12px;
        font-weight: 700;
        background: #e8edf3;
      }
      .upload-label.has-file {
        border-color: #7693af;
        background: #e1e8ef;
      }
      .post-status {
        min-height: 18px;
        font-size: 12px;
        color: #5d6470;
      }
      .post-status.error {
        color: #c94c3c;
      }
      .post-status.success {
        color: #16845b;
      }
      .create-badge {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border-radius: 13px;
        background: #e4eaf0;
        color: #315d8a;
        font-size: 24px;
      }
      .create-trigger {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 12px;
        text-align: left;
      }
      .create-trigger strong {
        font-size: 13px;
        color: #10131b;
      }
      .create-trigger span {
        display: block;
        margin-top: 3px;
        color: #8a909b;
        font-size: 11px;
      }
      @media (max-width: 820px) {
        .posts-layout {
          grid-template-columns: 1fr;
        }
        .post-composer {
          position: static;
          grid-row: 1;
        }
        .posts-feed {
          grid-row: 2;
        }
      }
      @media (max-width: 640px) {
        .posts-shell {
          width: min(100% - 20px, 920px);
        }
        .post-composer,
        .post-card {
          border-radius: 16px;
        }
        .posts-page header nav a:not(:last-child) {
          display: none;
        }
      }
        .posts-shell { width: min(100% - 32px, 920px); }
        .posts-layout { display: flex; flex-direction: column; gap: 22px; }
        .posts-feed { width: 100%; }
        .post-composer { position: static; order: -1; width: 100%; }
        .posts-page > header { position: sticky; top: 0; z-index: 20; }
    </style>
  </head>
  <body class="posts-page">
    <header class="border-b border-line">
      <div
        class="mx-auto flex max-w-6xl items-center justify-between px-5 py-4"
      >
        <a href="index.html" class="site-brand"
          ><img src="logo.png" alt="Relayless logo" /><span
            ><strong class="block text-sm">Relayless Messenger</strong
            ><small>Posts and conversations</small></span
          ></a
        >
      </div>
    </header>
    <main class="posts-shell py-10">
      <div class="mb-8">
        <p class="text-xs font-bold uppercase tracking-[.2em] text-blue-600">
          Posts feed
        </p>
      </div>
      <div class="posts-layout">
        <section id="feed" class="posts-feed space-y-5">
          <p id="feedLoading" class="py-12 text-center text-sm text-slate-500">
            Loading posts...
          </p>
        </section>
        <section id="composer" class="post-composer p-5 sm:p-6">
          <button id="createTrigger" type="button" class="create-trigger">
            <div class="create-badge">+</div>
            <span
              ><strong>Create a post</strong
              ><span>Share a thought, photo, or video</span></span
            >
          </button>
          <form id="postForm" class="mt-5">
            <textarea
              id="postText"
              maxlength="2000"
              class="w-full rounded-2xl px-4 py-3 text-sm"
              placeholder="Share something meaningful..."
            ></textarea>
            <div class="mt-4 space-y-2">
              <label class="upload-label w-full"
                ><input
                  id="mediaInput"
                  type="file"
                  accept="image/*,video/*"
                  class="hidden"
                />Add photo or video</label
              ><button
                id="publishButton"
                class="w-full rounded-full bg-blue-600 px-5 py-2.5 text-xs font-bold text-white"
              >
                Publish post
              </button>
            </div>
            <p id="postStatus" class="post-status mt-3" role="status"></p>
          </form>
        </section>
      </div>
    </main>
    <span id="composerName" class="hidden">Sign in to post</span
    ><span id="composerHint" class="hidden"
      >Your post will appear in the community feed.</span
    >
    <p
      id="toast"
      class="fixed bottom-5 left-1/2 hidden -translate-x-1/2 rounded-full bg-slate-900 px-5 py-3 text-xs text-white"
    ></p>
    <div id="postViewer" class="post-viewer" hidden>
      <div class="post-viewer-card">
        <div class="flex items-center justify-between border-b border-slate-200 px-5 py-4">
          <strong id="viewerTitle" class="text-sm text-slate-900">Post</strong>
          <button id="closeViewer" type="button" class="text-2xl leading-none text-slate-500" aria-label="Close full-size post">&times;</button>
        </div>
        <div id="viewerContent"></div>
      </div>
    </div>
    <div id="sharePanel" class="share-panel" hidden>
      <div class="share-panel-card p-5">
        <div class="flex items-center justify-between">
          <div><p class="text-xs font-bold uppercase tracking-[.16em] text-blue-600">Share post</p><h2 class="mt-1 text-lg font-extrabold text-slate-900">Send to a conversation</h2></div>
          <button id="closeShare" type="button" class="text-2xl leading-none text-slate-500" aria-label="Close share dialog">&times;</button>
        </div>
        <p id="shareStatus" class="mt-3 text-xs text-slate-500">Choose a friend.</p>
        <div id="shareFriends" class="mt-3 space-y-1"></div>
      </div>
    </div>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
      import {
        getAuth,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
      import {
        getFirestore,
        collection,
        query,
        orderBy,
        onSnapshot,
        doc,
        getDoc,
        getDocs,
        addDoc,
        updateDoc,
        serverTimestamp,
        increment,
      } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
      const config = {
          apiKey: "AIzaSyB7ssl6jTxKdy9XAtsAcrcvTU6eQjZzzQ8",
          authDomain: "relayless-messages.firebaseapp.com",
          projectId: "relayless-messages",
          storageBucket: "relayless-messages.firebasestorage.app",
          messagingSenderId: "157252473726",
          appId: "1:157252473726:web:7a2e2794c92dce7c49592f",
          measurementId: "G-6WZGL34YLC",
        },
        app = initializeApp(config),
        auth = getAuth(app),
        db = getFirestore(app),
        $ = (id) => document.getElementById(id),
        CLOUD_NAME = "mrq0ieyl",
        UPLOAD_PRESET = "ml_default";
      let viewer = null,
        viewerProfile = null;
      const toast = (text) => {
        const item = $("toast");
        item.textContent = text;
        item.classList.remove("hidden");
        setTimeout(() => item.classList.add("hidden"), 2800);
      };
      const escape = (value) =>
        String(value || "").replace(
          /[&<>'"]/g,
          (char) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              "'": "&#39;",
              '"': "&quot;",
            })[char],
        );
      const postTime = (value) => {
        const date = value?.toDate
          ? value.toDate()
          : value
            ? new Date(value)
            : null;
        if (!date) return "Just now";
        const minutes = Math.floor((Date.now() - date.getTime()) / 60000),
          hours = Math.floor(minutes / 60);
        if (minutes < 1) return "Just now";
        if (minutes < 60)
          return `${minutes} minute${minutes === 1 ? "" : "s"} ago`;
        if (hours < 24) return `${hours} hour${hours === 1 ? "" : "s"} ago`;
        return date.toLocaleString(undefined, {
          dateStyle: "medium",
          timeStyle: "short",
        });
      };
      async function uploadMedia(file) {
        const body = new FormData();
        body.append("file", file);
        body.append("upload_preset", UPLOAD_PRESET);
        const response = await fetch(
          `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`,
          { method: "POST", body },
        );
        const data = await response.json();
        if (!response.ok)
          throw Error(
            data.error?.message ||
              "Cloudinary upload failed. Confirm the ml_default preset is set to Unsigned.",
          );
        return data.secure_url;
      }
      function avatar(profile) {
        const photoURL = profile?.photoURL || profile?.authorPhotoURL;
        return photoURL
          ? `<img class="post-avatar" src="${escape(photoURL)}" alt="">`
          : `<span class="post-avatar post-avatar-fallback">${escape((profile?.displayName || "R")[0].toUpperCase())}</span>`;
      }
      async function profile(uid) {
        const snap = await getDoc(doc(db, "users", uid));
        return snap.exists()
          ? { uid: snap.id, ...snap.data() }
          : { uid, displayName: "Relayless user" };
      }
      async function publish(event) {
        event.preventDefault();
        if (!viewer) {
          $("postStatus").className = "post-status error mt-3";
          $("postStatus").textContent =
            "Sign in through Messages before publishing.";
          return;
        }
        const text = $("postText").value.trim(),
          file = $("mediaInput").files[0];
        if (!text && !file) {
          $("postStatus").className = "post-status error mt-3";
          $("postStatus").textContent =
            "Write something or choose media first.";
          return;
        }
        const button = $("publishButton");
        button.disabled = true;
        button.textContent = "Publishing...";
        $("postStatus").className = "post-status mt-3";
        $("postStatus").textContent = file
          ? "Uploading media to Cloudinary..."
          : "Saving post...";
        try {
          let mediaUrl = "",
            mediaType = "";
          if (file) {
            mediaUrl = await uploadMedia(file);
            mediaType = file.type.startsWith("video/") ? "video" : "image";
          }
          await addDoc(collection(db, "posts"), {
            authorId: viewer.uid,
            authorName:
              viewerProfile.displayName ||
              viewer.displayName ||
              "Relayless user",
            authorUsername: viewerProfile.username || "",
            authorPhotoURL: viewerProfile.photoURL || "",
            text,
            mediaUrl,
            mediaType,
            createdAt: serverTimestamp(),
            reactionCount: 0,
            commentCount: 0,
            reactions: {},
          });
          $("postText").value = "";
          $("mediaInput").value = "";
          $("postStatus").className = "post-status success mt-3";
          $("postStatus").textContent = "Post published successfully.";
        } catch (error) {
          $("postStatus").className = "post-status error mt-3";
          $("postStatus").textContent = error.message;
          toast(error.message);
        } finally {
          button.disabled = false;
          button.textContent = "Publish post";
        }
      }
      function renderPost(post) {
        const data = post.data,
          card = document.createElement("article");
        card.className = "post-card overflow-hidden";
        card.dataset.id = post.id;
        const date = data.createdAt?.toDate
          ? data.createdAt.toDate().toLocaleString()
          : "Just now";
        const media = data.mediaUrl
          ? data.mediaType === "video"
            ? `<video class="post-media" controls src="${escape(data.mediaUrl)}" data-view-media="${escape(data.mediaUrl)}"></video>`
            : `<img class="post-media" src="${escape(data.mediaUrl)}" alt="Post media" loading="lazy" data-view-media="${escape(data.mediaUrl)}">`
          : "";
        card.innerHTML = `<div class="flex items-center gap-3 p-5"><a href="profile.html?uid=${encodeURIComponent(data.authorId)}">${avatar(data)}</a><div class="min-w-0 flex-1"><a class="block truncate text-sm font-bold text-slate-900" href="profile.html?uid=${encodeURIComponent(data.authorId)}">${escape(data.authorName || "Relayless user")}</a><a class="block truncate text-xs text-blue-600" href="profile.html?uid=${encodeURIComponent(data.authorId)}">@${escape(data.authorUsername || "user")} · ${date}</a></div></div>${data.text ? `<p class="post-text-preview whitespace-pre-wrap px-5 pb-5 text-sm leading-6 text-slate-700">${escape(data.text)}</p>` : ""}${media}<div class="flex items-center gap-5 px-5 py-4 text-xs"><button class="post-action" data-action="react">Like <span>${data.reactionCount || 0}</span></button><button class="post-action" data-action="comments">Comment <span>${data.commentCount || 0}</span></button><button class="post-action" data-action="share">Share</button></div><div class="comment-list hidden px-5 pb-4"><div class="comments space-y-2"></div><form class="comment-form mt-3 flex gap-2"><input class="comment-input min-w-0 flex-1 rounded-full px-4 py-2 text-xs" maxlength="500" placeholder="Write a comment..."><button class="rounded-full bg-blue-600 px-4 py-2 text-xs font-bold text-white">Send</button></form></div>`;
        card.querySelectorAll('[data-view-media]').forEach((element) => {
          element.addEventListener('click', () => openViewer(data, element.dataset.viewMedia));
        });
        card.querySelector('.post-text-preview')?.addEventListener('click', () => openViewer(data));
        card.querySelector('[data-action="share"]').onclick = () => openShare(post);
        card.querySelector('[data-action="react"]').onclick = async () => {
          if (!viewer) {
            toast("Sign in to react.");
            return;
          }
          const liked = data.reactions?.[viewer.uid];
          await updateDoc(doc(db, "posts", post.id), {
            [`reactions.${viewer.uid}`]: liked ? null : "like",
            reactionCount: increment(liked ? -1 : 1),
          });
          data.reactions = data.reactions || {};
          if (liked) delete data.reactions[viewer.uid];
          else data.reactions[viewer.uid] = "like";
          data.reactionCount = (data.reactionCount || 0) + (liked ? -1 : 1);
          card
            .querySelector('[data-action="react"]')
            .classList.toggle("active", !liked);
          card.querySelector('[data-action="react"] span').textContent =
            data.reactionCount;
        };
        card.querySelector('[data-action="comments"]').onclick = () => {
          const area = card.querySelector(".comment-list");
          area.classList.toggle("hidden");
          if (!area.classList.contains("hidden")) loadComments(post.id, card);
        };
        card.querySelector(".comment-form").onsubmit = (event) =>
          addComment(event, post.id, card);
        return card;
      }
      function openViewer(data, mediaUrl = "") {
        $("viewerTitle").textContent = `@${data.authorUsername || "user"}`;
        $("viewerContent").innerHTML = mediaUrl
          ? data.mediaType === "video"
            ? `<video class="post-viewer-media" controls autoplay src="${escape(mediaUrl)}"></video>`
            : `<img class="post-viewer-media" src="${escape(mediaUrl)}" alt="Full-size post media">`
          : `<p class="whitespace-pre-wrap p-6 text-sm leading-7 text-slate-700">${escape(data.text || "")}</p>`;
        $("postViewer").hidden = false;
      }
      function closeViewer() { $("postViewer").hidden = true; $("viewerContent").replaceChildren(); }
      async function openShare(post) {
        if (!viewer) { toast("Sign in to share a post."); return; }
        $("sharePanel").hidden = false;
        $("shareFriends").innerHTML = '<p class="text-xs text-slate-500">Loading conversations...</p>';
        try {
          const ids = viewerProfile.conversations || [];
          if (!ids.length) { $("shareFriends").innerHTML = '<p class="text-xs text-slate-500">No conversations yet.</p>'; return; }
          const snap = await getDocs(query(collection(db, "users"), where("__name__", "in", ids.slice(0, 10))));
          $("shareFriends").replaceChildren();
          snap.forEach((item) => {
            const friend = { uid: item.id, ...item.data() }, row = document.createElement("button");
            row.className = "share-friend";
            row.innerHTML = `${avatar(friend)}<span class="min-w-0 flex-1"><strong class="block truncate text-sm text-slate-900">${escape(friend.displayName || "Relayless user")}</strong><span class="text-xs text-blue-600">@${escape(friend.username || "user")}</span></span>`;
            row.querySelector(".post-avatar").classList.add("share-friend-avatar");
            row.onclick = () => sendPostToFriend(post, friend);
            $("shareFriends").append(row);
          });
        } catch (error) { $("shareFriends").innerHTML = `<p class="text-xs text-rose-500">Could not load conversations: ${escape(error.message)}</p>`; }
      }
      async function sendPostToFriend(post, friend) {
        $("shareStatus").textContent = `Sending to @${friend.username || "user"}...`;
        try {
          const chat = [viewer.uid, friend.uid].sort().join("_");
          await addDoc(collection(db, "chats", chat, "messages"), { senderId: viewer.uid, type: "post", postId: post.id, postAuthor: post.data.authorName || "Relayless user", postUsername: post.data.authorUsername || "user", postText: post.data.text || "", postMediaUrl: post.data.mediaUrl || "", createdAt: serverTimestamp(), delivered: true, seen: false });
          $("shareStatus").textContent = `Post sent to @${friend.username || "user"}.`;
          toast("Post shared successfully.");
        } catch (error) { $("shareStatus").textContent = error.message || "Could not share post."; }
      }
      $("closeViewer").onclick = closeViewer;
      $("postViewer").onclick = (event) => { if (event.target.id === "postViewer") closeViewer(); };
      $("closeShare").onclick = () => { $("sharePanel").hidden = true; };
      $("sharePanel").onclick = (event) => { if (event.target.id === "sharePanel") $("sharePanel").hidden = true; };
      async function loadComments(postId, card) {
        const list = card.querySelector(".comments");
        list.replaceChildren();
        const snap = await getDocs(
          query(
            collection(db, "posts", postId, "comments"),
            orderBy("createdAt", "asc"),
          ),
        ).catch(() => null);
        if (!snap || snap.empty) {
          list.innerHTML =
            '<p class="text-xs text-slate-500">No comments yet.</p>';
          return;
        }
        snap.forEach((item) => {
          const data = item.data(),
            row = document.createElement("div");
          row.className = "comment-row py-2 text-xs";
          row.innerHTML = `<a class="font-bold text-blue-600" href="profile.html?uid=${encodeURIComponent(data.authorId)}">${escape(data.authorName)}</a><span class="ml-2 text-slate-600">${escape(data.text)}</span>`;
          list.append(row);
        });
      }
      async function addComment(event, postId, card) {
        event.preventDefault();
        if (!viewer) {
          toast("Sign in to comment.");
          return;
        }
        const input = card.querySelector(".comment-input"),
          text = input.value.trim();
        if (!text) return;
        const button = event.submitter;
        button.disabled = true;
        try {
          await addDoc(collection(db, "posts", postId, "comments"), {
            authorId: viewer.uid,
            authorName: viewerProfile.displayName || "Relayless user",
            text,
            createdAt: serverTimestamp(),
          });
          await updateDoc(doc(db, "posts", postId), {
            commentCount: increment(1),
          });
          input.value = "";
          loadComments(postId, card);
        } catch (error) {
          toast(error.message);
        } finally {
          button.disabled = false;
        }
      }
      onAuthStateChanged(auth, async (user) => {
        viewer = user;
        if (user) {
          viewerProfile = await profile(user.uid);
          $("composerName").textContent =
            viewerProfile.displayName || "Relayless user";
          $("composerHint").textContent =
            "Post as @" + (viewerProfile.username || "user");
        } else {
          $("composerName").textContent = "Sign in to post";
        }
      });
      $("postForm").onsubmit = publish;
      onSnapshot(
        query(collection(db, "posts"), orderBy("createdAt", "desc")),
        (snap) => {
          $("feed").replaceChildren();
          if (snap.empty) {
            $("feed").innerHTML =
              '<p class="post-card p-10 text-center text-sm text-slate-500">No posts yet. Be the first to share something.</p>';
            return;
          }
          snap.forEach((item) =>
            $("feed").append(renderPost({ id: item.id, data: item.data() })),
          );
        },
        (error) => {
          $("feed").innerHTML =
            `<p class="post-card p-10 text-center text-sm text-rose-500">Could not load posts: ${escape(error.message)}</p>`;
        },
      );
    </script>
    <script>
      document.getElementById("createTrigger").onclick = () => {
        const composer = document.getElementById("composer");
        composer.classList.toggle("is-open");
        if (composer.classList.contains("is-open"))
          document.getElementById("postText").focus();
      };
      document
        .getElementById("mediaInput")
        .addEventListener("change", (event) => {
          const label = document.querySelector(".upload-label");
          const file = event.target.files[0];
          label.classList.toggle("has-file", Boolean(file));
          label.lastChild.textContent = file
            ? ` ${file.name} selected`
            : "Add photo or video";
          const status = document.getElementById("postStatus");
          status.className = "post-status mt-3";
          status.textContent = file
            ? `1 ${file.type.startsWith("video/") ? "video" : "image"} selected: ${file.name}`
            : "";
        });
      const refreshPostTimes = () =>
        document
          .querySelectorAll(
            "#feed article a.text-blue-600:not([data-time-ready])",
          )
          .forEach((link) => {
            const parts = link.textContent.split(" · "),
              date = parts.pop();
            if (date && date !== "Just now") {
              const parsed = new Date(date);
              if (!Number.isNaN(parsed.getTime())) {
                link.textContent = `${parts.join(" · ")} · ${(() => {
                  const minutes = Math.floor(
                      (Date.now() - parsed.getTime()) / 60000,
                    ),
                    hours = Math.floor(minutes / 60);
                  return minutes < 1
                    ? "Just now"
                    : minutes < 60
                      ? `${minutes} minute${minutes === 1 ? "" : "s"} ago`
                      : hours < 24
                        ? `${hours} hour${hours === 1 ? "" : "s"} ago`
                        : parsed.toLocaleString(undefined, {
                            dateStyle: "medium",
                            timeStyle: "short",
                          });
                })()}`;
                link.dataset.timeReady = "true";
              }
            }
          });
      new MutationObserver(refreshPostTimes).observe(
        document.getElementById("feed"),
        { childList: true, subtree: true },
      );
    </script>
  <script src="site-menu.js"></script>
  </body>
</html>
