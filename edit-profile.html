<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relayless | Edit profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="site-menu.css">
  <style>
    .edit-page{min-height:100vh}.edit-shell{width:min(calc(100% - 32px),780px);margin:0 auto}.edit-card{border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.94);box-shadow:0 25px 70px rgba(20,42,86,.13)}.edit-page input,.edit-page textarea{border:1px solid var(--line);background:#f7f9fc;color:var(--ink);outline:none}.edit-page input:focus,.edit-page textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(23,105,255,.1)}.edit-page textarea{min-height:100px;resize:vertical}.edit-status{min-height:20px;color:#5d6470;font-size:12px}.edit-status.success{color:#16845b}.edit-status.error{color:#c94c3c}.edit-page .hidden{display:none}
  </style>
</head>
<body class="edit-page">
  <header class="border-b border-line"><div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-4"><a href="index.html" class="site-brand"><img src="logo.png" alt="Relayless Messenger logo"><span><strong class="block text-sm">Relayless Messenger</strong><small>Profile settings</small></span></a></div></header>
  <main class="edit-shell py-10">
    <section class="edit-card p-6 sm:p-9">
      <a id="backLink" class="text-xs font-semibold text-blue-600" href="profile.html">&lt;- Back to profile</a>
      <div class="mt-6"><p class="text-xs font-bold uppercase tracking-[.2em] text-blue-600">Account</p><h1 class="mt-2 text-3xl font-extrabold text-slate-900">Edit profile</h1><p class="mt-2 text-sm text-slate-500">Update the details people see on your profile.</p></div>
      <form id="editForm" class="mt-8 space-y-5">
        <div class="grid gap-4 sm:grid-cols-2"><label class="text-xs font-semibold text-slate-500">Display name<input id="editName" class="mt-2 w-full rounded-xl px-3 py-3 text-sm"></label><label class="text-xs font-semibold text-slate-500">Username<input id="editUsername" class="mt-2 w-full rounded-xl px-3 py-3 text-sm"></label></div>
        <label class="block text-xs font-semibold text-slate-500">Bio<textarea id="editBio" maxlength="160" class="mt-2 w-full rounded-xl px-3 py-3 text-sm"></textarea></label>
        <div class="grid gap-4 sm:grid-cols-2"><label class="text-xs font-semibold text-slate-500">Location<input id="editLocation" maxlength="80" class="mt-2 w-full rounded-xl px-3 py-3 text-sm"></label><label class="text-xs font-semibold text-slate-500">Website<input id="editWebsite" type="url" maxlength="160" class="mt-2 w-full rounded-xl px-3 py-3 text-sm" placeholder="https://example.com"></label></div>
        <label class="block text-xs font-semibold text-slate-500">Gender<select id="editGender" class="mt-2 w-full rounded-xl px-3 py-3 text-sm"><option value="">Prefer not to say</option><option value="Woman">Woman</option><option value="Man">Man</option><option value="Non-binary">Non-binary</option><option value="Other">Other</option></select></label>
        <label class="block text-xs font-semibold text-slate-500">Profile picture<input id="editImage" type="file" accept="image/*" class="mt-2 w-full rounded-xl px-3 py-3 text-sm"></label>
        <p id="saveStatus" class="edit-status" role="status"></p>
        <div class="flex flex-wrap gap-2"><button id="saveProfile" type="submit" class="rounded-full bg-blue-600 px-5 py-2.5 text-xs font-bold text-white">Save changes</button><a id="cancelEdit" class="rounded-full border border-slate-200 px-5 py-2.5 text-xs font-bold text-slate-700" href="profile.html">Cancel</a></div>
      </form>
    </section>
  </main>
  <script type="module">
    import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
    import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
    import{getFirestore,doc,getDoc,updateDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';
    const config={apiKey:'AIzaSyB7ssl6jTxKdy9XAtsAcrcvTU6eQjZzzQ8',authDomain:'relayless-messages.firebaseapp.com',projectId:'relayless-messages',storageBucket:'relayless-messages.firebasestorage.app',messagingSenderId:'157252473726',appId:'1:157252473726:web:7a2e2794c92dce7c49592f',measurementId:'G-6WZGL34YLC'};
    const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id),uid=new URLSearchParams(location.search).get('uid');let viewer=null,profile=null;
    const status=(text,type='normal')=>{$('saveStatus').className=`edit-status ${type==='error'?'error':type==='success'?'success':''}`;$('saveStatus').textContent=text};
    const wait=(promise,label)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error(`${label} timed out. Check your connection and try again.`)),12000))]);
    const imageData=async file=>{if(!file||!file.type.startsWith('image/'))throw Error('Choose an image file.');const source=await createImageBitmap(file),scale=Math.min(1,512/Math.max(source.width,source.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(source.width*scale));canvas.height=Math.max(1,Math.round(source.height*scale));canvas.getContext('2d').drawImage(source,0,0,canvas.width,canvas.height);const data=canvas.toDataURL('image/jpeg',.78);if(data.length>850000)throw Error('Image is too large after compression. Choose a smaller image.');return data};
    function fill(){for(const [id,key] of [['editName','displayName'],['editUsername','username'],['editBio','bio'],['editLocation','location'],['editWebsite','website'],['editGender','gender']])$(id).value=profile[key]||'';$('backLink').href=`profile.html?uid=${encodeURIComponent(profile.uid)}`;$('cancelEdit').href=$('backLink').href}
    async function save(event){event.preventDefault();const button=$('saveProfile');button.disabled=true;button.textContent='Saving...';status('Updating profile...');const username=$('editUsername').value.trim().toLowerCase();if(!/^[a-z0-9_]{3,20}$/.test(username)){status('Username must be 3-20 letters, numbers, or underscores.','error');button.disabled=false;button.textContent='Save changes';return}const changes={displayName:$('editName').value.trim()||'Relayless user',bio:$('editBio').value.trim(),location:$('editLocation').value.trim(),website:$('editWebsite').value.trim(),gender:$('editGender').value.trim(),updatedAt:serverTimestamp()};try{await wait(updateDoc(doc(db,'users',viewer.uid),changes),'Profile update');profile={...profile,...changes};let notice='Profile updated successfully.';if(username!==profile.username){try{status('Updating username...');const usernameSnap=await wait(getDoc(doc(db,'usernames',username)),'Username check');if(usernameSnap.exists()&&usernameSnap.data().uid!==viewer.uid)throw Error('Username is taken.');await wait(setDoc(doc(db,'usernames',username),{uid:viewer.uid}),'Username registration');await wait(updateDoc(doc(db,'users',viewer.uid),{username}),'Username update');profile.username=username}catch(error){notice+=` Username was not changed: ${error.message}`}}if($('editImage').files[0]){try{status('Updating profile picture...');const photoURL=await wait(imageData($('editImage').files[0]),'Picture processing');await wait(updateDoc(doc(db,'users',viewer.uid),{photoURL}),'Picture update');profile.photoURL=photoURL}catch(error){notice+=` Picture was not changed: ${error.message}`}}status(notice,notice==='Profile updated successfully.'?'success':'error');button.disabled=false;button.textContent='Save changes';if(notice==='Profile updated successfully.')setTimeout(()=>{location.href=$('backLink').href},700)}catch(error){status(error.message||'Could not save profile changes.','error');button.disabled=false;button.textContent='Save changes'}}
    onAuthStateChanged(auth,async user=>{viewer=user;if(!user){location.href='messaging/index.html';return}const target=uid||user.uid;if(target!==user.uid){location.href=`profile.html?uid=${encodeURIComponent(target)}`;return}const snapshot=await getDoc(doc(db,'users',user.uid));if(!snapshot.exists()){status('Your profile could not be found.','error');return}profile={uid:snapshot.id,...snapshot.data()};fill()});$('editForm').onsubmit=save;
  </script>
  <script src="site-menu.js"></script>
</body>
</html>
