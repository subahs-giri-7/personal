<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relayless | Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .profile-page{min-height:100vh}.profile-cover{height:210px;background:linear-gradient(120deg,#1769ff,#75b8ff 52%,#c6ec68);border-radius:0 0 28px 28px}.profile-card{margin:-76px auto 0!important;position:relative;max-width:780px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.94);box-shadow:0 25px 70px rgba(20,42,86,.13)}.profile-avatar{width:116px;height:116px;border:7px solid #fff;border-radius:50%;object-fit:cover;background:#e9f0ff}.profile-avatar-fallback{display:grid;place-items:center;color:#1769ff;font:800 38px Manrope;background:#e9f0ff}.profile-stat{border-left:1px solid var(--line)}.profile-stat:first-child{border-left:0}.profile-form{display:none}.profile-form.is-visible{display:block}.profile-note{color:#8a909b}.profile-page input,.profile-page textarea{border:1px solid var(--line);background:#f7f9fc;color:var(--ink);outline:none}.profile-page input:focus,.profile-page textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(23,105,255,.1)}.presence-dot{width:11px;height:11px;border:2px solid #fff;border-radius:50%;background:#a8b0ba;display:inline-block}.presence-dot.online{background:#36b37e}.profile-actions button{min-width:120px}.profile-page .hidden{display:none}.save-status{min-height:18px;color:#5d6470;font-size:12px}.save-status.success{color:#16845b}.save-status.error{color:#c94c3c}
  </style>
</head>
<body class="profile-page">
  <header class="border-b border-line"><div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-4"><a href="index.html" class="site-brand"><img src="logo.png" alt="Relayless logo"><span><strong class="block text-sm">Relayless</strong><small>Private conversations</small></span></a><nav class="flex items-center gap-4 text-xs font-semibold text-slate-500"><a href="messaging/index.html">Messages</a><a href="share.html">Share</a><a href="call/index.html">Calls</a></nav></div></header>
  <main>
    <div class="profile-cover"></div>
    <section class="profile-card mx-5 overflow-hidden p-6 sm:p-9">
      <div id="loading" class="py-16 text-center text-sm text-slate-500">Loading profile...</div>
      <div id="profileContent" class="hidden">
        <div class="flex flex-col items-center text-center sm:flex-row sm:items-end sm:text-left">
          <div id="avatarFallback" class="profile-avatar profile-avatar-fallback">R</div><img id="avatar" class="profile-avatar hidden" alt="Profile picture">
          <div class="mt-4 flex-1 sm:ml-5 sm:mt-0"><div class="flex items-center justify-center gap-2 sm:justify-start"><h1 id="displayName" class="text-3xl font-extrabold text-slate-900"></h1><span id="presence" class="presence-dot" title="Offline"></span></div><p id="username" class="mt-1 text-sm text-blue-600"></p><p id="bio" class="mt-3 max-w-xl text-sm leading-6 text-slate-500"></p></div>
          <div class="profile-actions mt-5 flex gap-2 sm:mt-0"><button id="followButton" class="rounded-full bg-blue-600 px-5 py-2.5 text-xs font-bold text-white">Follow</button><a id="messageButton" class="rounded-full border border-slate-200 px-5 py-2.5 text-xs font-bold text-slate-700" href="#">Message</a><button id="editButton" class="hidden rounded-full border border-slate-200 px-5 py-2.5 text-xs font-bold text-slate-700">Edit profile</button></div>
        </div>
        <div class="mt-8 grid grid-cols-3 border-y border-slate-100 py-4 text-center"><div class="profile-stat"><strong id="followers" class="block text-lg text-slate-900">0</strong><span class="text-[10px] uppercase tracking-[.16em] text-slate-400">Followers</span></div><div class="profile-stat"><strong id="following" class="block text-lg text-slate-900">0</strong><span class="text-[10px] uppercase tracking-[.16em] text-slate-400">Following</span></div><div class="profile-stat"><strong id="joined" class="block text-lg text-slate-900">-</strong><span class="text-[10px] uppercase tracking-[.16em] text-slate-400">Joined</span></div></div>
        <div class="mt-8 grid gap-4 text-sm sm:grid-cols-2"><div><span class="text-xs font-semibold uppercase tracking-[.16em] text-slate-400">Location</span><p id="location" class="mt-2 text-slate-600">Not added</p></div><div><span class="text-xs font-semibold uppercase tracking-[.16em] text-slate-400">Website</span><p id="website" class="mt-2 break-all text-blue-600">Not added</p></div></div>
        <form id="editForm" class="profile-form mt-8 border-t border-slate-100 pt-7"><div class="grid gap-4 sm:grid-cols-2"><label class="text-xs font-semibold text-slate-500">Display name<input id="editName" class="mt-2 w-full rounded-xl px-3 py-3 text-sm"></label><label class="text-xs font-semibold text-slate-500">Username<input id="editUsername" class="mt-2 w-full rounded-xl px-3 py-3 text-sm"></label><label class="text-xs font-semibold text-slate-500 sm:col-span-2">Bio<textarea id="editBio" maxlength="160" rows="3" class="mt-2 w-full rounded-xl px-3 py-3 text-sm"></textarea></label><label class="text-xs font-semibold text-slate-500">Location<input id="editLocation" maxlength="80" class="mt-2 w-full rounded-xl px-3 py-3 text-sm"></label><label class="text-xs font-semibold text-slate-500">Website<input id="editWebsite" type="url" maxlength="160" class="mt-2 w-full rounded-xl px-3 py-3 text-sm" placeholder="https://example.com"></label><label class="text-xs font-semibold text-slate-500 sm:col-span-2">Profile picture<input id="editImage" type="file" accept="image/*" class="mt-2 w-full rounded-xl px-3 py-3 text-sm"></label></div><p id="saveStatus" class="save-status mt-4" role="status"></p><div class="mt-2 flex gap-2"><button id="saveProfile" class="rounded-full bg-blue-600 px-5 py-2.5 text-xs font-bold text-white">Save changes</button><button id="cancelEdit" type="button" class="rounded-full border border-slate-200 px-5 py-2.5 text-xs font-bold text-slate-700">Cancel</button></div></form>
      </div>
      <div id="error" class="hidden py-16 text-center"><h1 class="text-2xl font-extrabold text-slate-900">Profile unavailable</h1><p class="mt-2 text-sm text-slate-500">This user profile could not be found.</p></div>
    </section>
  </main>
  <p id="toast" class="fixed bottom-5 left-1/2 hidden -translate-x-1/2 rounded-full bg-slate-900 px-5 py-3 text-xs text-white"></p>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
import{getFirestore,doc,getDoc,updateDoc,arrayUnion,arrayRemove,serverTimestamp,runTransaction,deleteDoc}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';
import{getStorage,ref,uploadBytes,getDownloadURL}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js';
const config={apiKey:'AIzaSyB7ssl6jTxKdy9XAtsAcrcvTU6eQjZzzQ8',authDomain:'relayless-messages.firebaseapp.com',projectId:'relayless-messages',storageBucket:'relayless-messages.firebasestorage.app',messagingSenderId:'157252473726',appId:'1:157252473726:web:7a2e2794c92dce7c49592f',measurementId:'G-6WZGL34YLC'};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app),storage=getStorage(app),$=id=>document.getElementById(id),uid=new URLSearchParams(location.search).get('uid');let viewer=null,profile=null;
const formatDate=value=>value?.toDate?value.toDate().toLocaleDateString(undefined,{month:'long',year:'numeric'}):value?new Date(value).toLocaleDateString(undefined,{month:'long',year:'numeric'}):'-';const toast=text=>{const item=$('toast');item.textContent=text;item.classList.remove('hidden');setTimeout(()=>item.classList.add('hidden'),2600)};
function render(){const image=profile.photoURL;if(image){$('avatar').src=image;$('avatar').classList.remove('hidden');$('avatarFallback').classList.add('hidden')}else{$('avatarFallback').textContent=(profile.displayName||'R')[0].toUpperCase();$('avatar').classList.add('hidden');$('avatarFallback').classList.remove('hidden')}$('displayName').textContent=profile.displayName||'Relayless user';$('username').textContent=`@${profile.username||'unknown'} · ID: ${profile.uid}`;$('bio').textContent=profile.bio||'No bio yet.';$('location').textContent=profile.location||'Not added';const website=profile.website;$('website').textContent=website||'Not added';if(website){$('website').outerHTML=`<a id="website" class="mt-2 block break-all text-blue-600" href="${website}" target="_blank" rel="noreferrer">${website}</a>`}$('followers').textContent=(profile.followers||[]).length;$('following').textContent=(profile.following||[]).length;$('joined').textContent=formatDate(profile.createdAt);const online=profile.online===true&&profile.lastSeen?.toDate&&Date.now()-profile.lastSeen.toDate().getTime()<120000;$('presence').classList.toggle('online',online);$('presence').title=online?'Online':'Offline';$('followButton').classList.toggle('hidden',!viewer||viewer.uid===profile.uid);$('editButton').classList.toggle('hidden',!viewer||viewer.uid!==profile.uid);$('followButton').textContent=viewer&&profile.followers?.includes(viewer.uid)?'Unfollow':'Follow';$('messageButton').href=`messaging/index.html?uid=${encodeURIComponent(profile.uid)}`;$('profileContent').classList.remove('hidden');$('loading').classList.add('hidden')}
async function load(){if(!uid){$('loading').classList.add('hidden');$('error').classList.remove('hidden');return}const snap=await getDoc(doc(db,'users',uid));if(!snap.exists()){$('loading').classList.add('hidden');$('error').classList.remove('hidden');return}profile={uid:snap.id,...snap.data()};render()}
async function follow(){if(!viewer){location.href=`messaging/index.html?redirect=${encodeURIComponent(location.href)}`;return}const following=profile.followers?.includes(viewer.uid);await Promise.all([updateDoc(doc(db,'users',viewer.uid),{following:following?arrayRemove(profile.uid):arrayUnion(profile.uid)}),updateDoc(doc(db,'users',profile.uid),{followers:following?arrayRemove(viewer.uid):arrayUnion(viewer.uid)})]);profile.followers=profile.followers||[];profile.followers=following?profile.followers.filter(item=>item!==viewer.uid):[...profile.followers,viewer.uid];render()}
function startEdit(){for(const [id,key] of [['editName','displayName'],['editUsername','username'],['editBio','bio'],['editLocation','location'],['editWebsite','website']])$(id).value=profile[key]||'';$('editForm').classList.add('is-visible');$('editButton').classList.add('hidden')}
async function save(event){event.preventDefault();const button=event.submitter||$('saveProfile'),status=$('saveStatus');button.disabled=true;button.textContent='Saving...';status.className='save-status mt-4';status.textContent='Saving your profile...';const username=$('editUsername').value.trim().toLowerCase();if(!/^[a-z0-9_]{3,20}$/.test(username)){status.className='save-status error mt-4';status.textContent='Username must be 3-20 letters, numbers, or underscores.';button.disabled=false;button.textContent='Save changes';return}const changes={displayName:$('editName').value.trim()||'Relayless user',username,bio:$('editBio').value.trim(),location:$('editLocation').value.trim(),website:$('editWebsite').value.trim(),updatedAt:serverTimestamp()};try{if($('editImage').files[0]){const location=ref(storage,`avatars/${viewer.uid}`);await uploadBytes(location,$('editImage').files[0]);changes.photoURL=await getDownloadURL(location)}await runTransaction(db,async transaction=>{if(username!==profile.username){const usernameRef=doc(db,'usernames',username);if((await transaction.get(usernameRef)).exists())throw Error('Username is taken.');transaction.set(usernameRef,{uid:viewer.uid});if(profile.username)transaction.delete(doc(db,'usernames',profile.username))}transaction.update(doc(db,'users',viewer.uid),changes)});profile={...profile,...changes};$('editForm').classList.remove('is-visible');render();toast('Profile updated.')}catch(error){status.className='save-status error mt-4';status.textContent=error.message||'Could not save changes.';toast(error.message||'Could not save changes.')}finally{button.disabled=false;button.textContent='Save changes'}}
onAuthStateChanged(auth,user=>{viewer=user;load().catch(()=>{$('loading').classList.add('hidden');$('error').classList.remove('hidden')})});$('followButton').onclick=follow;$('editButton').onclick=startEdit;$('cancelEdit').onclick=()=>{$('editForm').classList.remove('is-visible');$('editButton').classList.remove('hidden')};$('editForm').onsubmit=save;
</script>
</body>
</html>
